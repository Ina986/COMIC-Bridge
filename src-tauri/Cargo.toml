[package]
name = "comic-bridge"
version = "1.9.60"
description = "漫画原稿の入稿チェック・差替え・分割を行うデスクトップアプリ"
# 作者名(固有名詞)はソースに直打ちしない。正式な値は参照アドレスリスト(cargo.author)を参照。
authors = []
edition = "2021"

[lib]
name = "comic_bridge_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# ビルド時にリソース(scripts/*.jsx, pdfium.dll)の SHA-256 を算出して exe へ焼き込む(門番の鍵)
sha2 = "0.10"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 参照アドレスリスト(addresses.json)の復号(割符方式)。アプリは復号のみ。
# 暗号化は別ツール(comicbridge\ツール\seal-addresses)が行う。
aes-gcm = "0.10"
sha2 = "0.10"

# 既定アプリでファイルを開く(Windowsは ShellExecuteW を使用＝cmdシェル非経由でメタ文字注入を回避)
opener = "0.7"

# G:共有からの更新(GitHub非依存)の minisign 署名検証。updater プラグインと同じ信頼基盤。
minisign-verify = "0.2"
base64 = "0.21"

# Image processing
image = "0.25"
psd = "0.3"
thiserror = "1.0"

# PDF rendering
pdfium-render = "0.8"

# Font name resolution (PostScript → display name)
fontdb = "0.22"
ttf-parser = "0.24"

# File system traversal
walkdir = "2"

# File system watching
notify = "7"

# Parallel processing
rayon = "1.10"

# Async runtime
tokio = { version = "1", features = ["rt", "sync"] }

# 開発ビルドでも画像処理を高速化
[profile.dev]
opt-level = 2

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.psd]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.pdfium-render]
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
