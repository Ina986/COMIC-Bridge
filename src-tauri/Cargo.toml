[package]
name = "manga-psd-manager"
version = "0.1.0"
description = "漫画原稿PSD管理アプリ"
authors = ["you"]
edition = "2021"

[lib]
name = "manga_psd_manager_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Image processing
image = "0.25"
psd = "0.3"
thiserror = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
