name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Ensure PDFium binary
        shell: pwsh
        run: |
          $target = "src-tauri/resources/pdfium/pdfium.dll"
          if (Test-Path $target) {
            Write-Host "PDFium already present in repo, skipping download."
          } else {
            New-Item -ItemType Directory -Force -Path src-tauri/resources/pdfium | Out-Null
            Invoke-WebRequest -Uri "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz" -OutFile pdfium.tgz
            tar -xzf pdfium.tgz
            $dll = Get-ChildItem -Recurse -Filter "pdfium.dll" | Select-Object -First 1
            Copy-Item $dll.FullName $target
            Remove-Item pdfium.tgz -Force
          }

      - name: Install frontend dependencies
        run: npm install

      - name: Inject address-ref pointer + updater pubkey (bridge)
        shell: pwsh
        env:
          ADDRESS_REF_PATH: ${{ secrets.ADDRESS_REF_PATH }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ADDRESS_REF_PATH)) { throw "ADDRESS_REF_PATH secret is empty" }
          # 1) Build a pure-ASCII (\uXXXX-escaped) JSON pointer and inject into the NSIS hook.
          $obj = [ordered]@{ referenceListPath = $env:ADDRESS_REF_PATH; patchedBy = "bridge-nsis"; schemaVersion = 1 }
          $json = $obj | ConvertTo-Json -Compress
          $sb = New-Object System.Text.StringBuilder
          foreach ($ch in $json.ToCharArray()) {
            $code = [int][char]$ch
            if ($code -gt 127) { [void]$sb.AppendFormat('\u{0:x4}', $code) } else { [void]$sb.Append($ch) }
          }
          $escaped = $sb.ToString()
          $nsh = "src-tauri/windows/hooks.nsh"
          $n = Get-Content $nsh -Raw
          if ($n -notlike '*__POINTER_JSON__*') { throw "hooks.nsh placeholder missing" }
          ($n -replace '__POINTER_JSON__', $escaped) | Set-Content $nsh -NoNewline -Encoding ascii
          Write-Host "Injected pointer JSON (ascii, len=$($escaped.Length))"
          # 2) Replace updater placeholders so tauri build succeeds (pubkey is public; endpoint vestigial - app uses updater_local).
          $conf = "src-tauri/tauri.conf.json"
          $c = Get-Content $conf -Raw
          $c = $c -replace 'ADDRESS_PATCH_REQUIRED_INJECT_BEFORE_BUILD', 'dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDcwNjc2NEFFM0I2MTU3QTAKUldTZ1YyRTdybVJuY0tsbGlGMWtBRmVvWCtsWVFLV2tKRUsrcVhHbmVHMHlUakxENFN2SGUyYSsK'
          $c = $c -replace 'https://address-patch-required\.invalid/latest\.json', 'https://github.com/yamamoto-ryusei-ux/COMIC-Bridge-app/releases/latest/download/latest.json'
          Set-Content $conf $c -NoNewline -Encoding utf8
          Write-Host "Injected updater pubkey/endpoint into tauri.conf"

      - name: Build the app (no release; artifacts uploaded for manual release)
        uses: tauri-apps/tauri-action@v0.5
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}

      - name: Upload NSIS bundle (installer + .sig)
        uses: actions/upload-artifact@v4
        with:
          name: nsis-bundle
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
